<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Rankings 全球榜单 | 钢材贸易情报</title>
<style>
@font-face{font-family:'MiSans';font-weight:100 900;font-display:swap;src:local('MiSans VF'),local('MiSans'),local('MiSans-Regular'),local('MiSans-Medium'),local('MiSans-Semibold'),local('MiSans-Bold');}

:root{
  --red:#C00000;--ink:#16191d;--muted:#79808a;
  --line:#e9ebee;--hair:#eef0f2;--bg:#ffffff;
  --up:#c0392b;--dn:#1f9d6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'MiSans','MiSans VF','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-size:14px}

/* Top bar */
.topbar{height:3px;background:var(--red);width:100%}
.header{display:flex;align-items:center;gap:20px;padding:16px 40px 14px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:50}
.header .back{color:var(--red);text-decoration:none;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:5px;white-space:nowrap}
.header .back:hover{text-decoration:underline}
.header .title-block{flex:1}
.header h1{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.logo-wrap svg{width:auto;height:28px;display:block}

/* Layout */
.layout{display:flex;max-width:1400px;margin:0 auto}
.sidebar{width:220px;flex:0 0 220px;position:sticky;top:54px;height:calc(100vh - 54px);
  overflow-y:auto;padding:20px 0;border-right:1px solid var(--line)}
.main{flex:1;min-width:0;padding:28px 40px 60px}

/* Sidebar nav */
.sb-group{margin-bottom:4px}
.sb-cat{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;
  text-transform:uppercase;padding:8px 18px 4px}
.sb-item{display:block;padding:7px 18px;font-size:13px;color:var(--ink);
  text-decoration:none;border-left:2px solid transparent;cursor:pointer;
  transition:.12s}
.sb-item:hover{background:var(--hair);color:var(--red)}
.sb-item.active{border-left-color:var(--red);color:var(--red);
  font-weight:600;background:#fdf2f2}
.sb-num{font-size:11px;color:#bcc1c9;margin-right:4px;font-variant-numeric:tabular-nums}

/* Tab bar */
.tab-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;
  border-bottom:1px solid var(--line);padding-bottom:14px}
.tab-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;cursor:pointer;color:var(--muted);
  font-family:inherit;transition:.12s;white-space:nowrap}
.tab-btn:hover{border-color:var(--red);color:var(--red)}
.tab-btn.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}

/* Section heading */
.sec-head{margin-bottom:18px}
.sec-head h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec-head h2::before{content:'';display:block;width:3px;height:18px;
  background:var(--red);border-radius:2px;flex-shrink:0}
.sec-head p{font-size:12.5px;color:var(--muted);margin-top:5px;padding-left:11px}

/* Tables */
.dtable-wrap{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{font-size:11.5px;font-weight:700;color:var(--muted);padding:8px 12px;
  text-align:left;border-bottom:2px solid var(--ink);white-space:nowrap;
  letter-spacing:.02em}
.dtable th.r{text-align:right}
.dtable td{padding:9px 12px;border-bottom:1px dashed var(--line);
  font-variant-numeric:tabular-nums;vertical-align:middle}
.dtable td.r{text-align:right}
.dtable td.mono{font-family:'Courier New',monospace;font-size:12.5px}
.dtable tr:hover td{background:var(--hair)}
.dtable .rank{font-size:12px;color:var(--muted);font-weight:700;width:36px}
.dtable .rank-1{color:var(--red);font-weight:900}
.dtable .rank-2{color:#444;font-weight:800}
.dtable .rank-3{color:#666;font-weight:700}
.badge-up{color:var(--up);font-size:12px;font-weight:600}
.badge-dn{color:var(--dn);font-size:12px;font-weight:600}
.badge-flat{color:var(--muted);font-size:12px}
.country-flag{font-size:15px;margin-right:4px}

/* Section panels */
.panel{display:none}
.panel.active{display:block}

/* Filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filter-bar label{font-size:12.5px;color:var(--muted);font-weight:600}
.filter-bar select{border:1px solid var(--line);border-radius:6px;
  padding:5px 10px;font-size:13px;font-family:inherit;color:var(--ink);
  background:#fff;cursor:pointer}
.filter-bar select:focus{outline:1px solid var(--red)}

/* Info note */
.note{font-size:12px;color:var(--muted);padding:8px 12px;background:var(--hair);
  border-left:3px solid var(--line);border-radius:0 4px 4px 0;margin-bottom:16px}

/* Responsive */
@media(max-width:800px){
  .sidebar{display:none}
  .main{padding:20px 16px 40px}
}
</style>
</head>

.gnav-dt{flex-direction:row;align-items:center;gap:6px}

.gnav-dm a{font-size:13px;color:#3d4650;text-decoration:none;padding:8px 12px;border-radius:7px}
.gnav-dm a:hover{background:#f4f5f7;color:#16191d}

body.has-gnav{padding-top:58px!important}
@media(max-width:820px){.gnav{overflow-x:auto}.gnav-menu>a i,.gnav-dt i{display:none}}
</style>
